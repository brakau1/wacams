# =============================================================================
# WACAMS - Oracle Cloud Production Docker Compose
# =============================================================================
# Version: 1.0.0
# Last Updated: 2026-11-17
# Target: Oracle Cloud Infrastructure (OCI)
# =============================================================================

version: '3.8'

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"
    compress: "true"
    tag: "{{.Name}}"

x-restart: &default-restart
  restart: unless-stopped

x-healthcheck-defaults: &default-healthcheck
  interval: 30s
  timeout: 10s
  retries: 3
  start_period: 60s

services:
  # ===========================================================================
  # NGINX - Reverse Proxy & SSL Termination
  # ===========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: wacams-nginx
    <<: *default-restart
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/health"]
    networks:
      - wacams-frontend
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    labels:
      com.wacams.service: "nginx"
      com.wacams.environment: "production"

  # ===========================================================================
  # BACKEND - .NET 8 API
  # ===========================================================================
  backend:
    image: ${DOCKER_REGISTRY:-ghcr.io}/wacams/backend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile.backend
    container_name: wacams-backend
    <<: *default-restart
    expose:
      - "8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ASPNETCORE_Kestrel__Endpoints__Http__Url: http://0.0.0.0:8080
      TZ: Africa/Johannesburg
      # Database
      ConnectionStrings__WacamDb: "Host=postgres;Port=5432;Database=${DB_NAME};Username=${DB_USER};Password=${DB_PASSWORD};SSL Mode=Prefer;Trust Server Certificate=true;Max Pool Size=${DB_POOL_SIZE:-100};"
      # JWT
      Jwt__Key: ${JWT_KEY}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      # GIS Integration
      GIS__BaseUrl: ${GIS_BASE_URL}
      GIS__Username: ${GIS_USERNAME}
      GIS__Password: ${GIS_PASSWORD}
      GIS__SyncIntervalMinutes: ${GIS_SYNC_INTERVAL:-60}
      GIS__MaxRetryAttempts: ${GIS_MAX_RETRIES:-3}
      GIS__EnableScheduledSync: ${GIS_ENABLE_SYNC:-true}
      # Email
      Email__SmtpHost: ${SMTP_HOST}
      Email__SmtpPort: ${SMTP_PORT}
      Email__SmtpUsername: ${SMTP_USERNAME}
      Email__SmtpPassword: ${SMTP_PASSWORD}
      Email__FromAddress: ${SMTP_FROM_ADDRESS}
      Email__FromName: ${SMTP_FROM_NAME}
      Email__EnableSsl: ${SMTP_ENABLE_SSL:-true}
      # Azure Storage
      AzureStorage__ConnectionString: ${AZURE_STORAGE_CONNECTION_STRING}
      AzureStorage__ContainerName: ${AZURE_STORAGE_CONTAINER:-signed-forms}
      AzureStorage__EnableBlobStorage: ${AZURE_STORAGE_ENABLED:-false}
      # Logging
      Logging__LogLevel__Default: ${LOG_LEVEL:-Information}
      Logging__LogLevel__Microsoft.AspNetCore: Warning
      Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
      # Security
      Security__MaxLoginAttempts: ${MAX_LOGIN_ATTEMPTS:-5}
      Security__LockoutDurationMinutes: ${LOCKOUT_DURATION:-15}
      # CORS
      CORS__AllowedOrigins: ${CORS_ORIGINS:-https://localhost}
      # Rate Limiting
      RateLimiting__Enable: "true"
      RateLimiting__RequestsPerMinute: ${RATE_LIMIT_PER_MINUTE:-60}
    volumes:
      - signatures_data:/app/wwwroot/signatures
      - backend_logs:/app/logs
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wacams-frontend
      - wacams-backend
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    labels:
      com.wacams.service: "backend"
      com.wacams.environment: "production"

  # ===========================================================================
  # FRONTEND - React SPA (served via Nginx)
  # ===========================================================================
  frontend:
    image: ${DOCKER_REGISTRY:-ghcr.io}/wacams/frontend:${IMAGE_TAG:-latest}
    build:
      context: ..
      dockerfile: Dockerfile.frontend
    container_name: wacams-frontend
    <<: *default-restart
    expose:
      - "80"
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:80/"]
    networks:
      - wacams-frontend
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    labels:
      com.wacams.service: "frontend"
      com.wacams.environment: "production"

  # ===========================================================================
  # POSTGRESQL - Primary Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: wacams-postgres
    <<: *default-restart
    expose:
      - "5432"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Africa/Johannesburg
      PGTZ: Africa/Johannesburg
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./postgres/init-scripts:/docker-entrypoint-initdb.d:ro
      - postgres_logs:/var/log/postgresql
      - postgres_backup:/backup
    command: >
      postgres
        -c config_file=/etc/postgresql/postgresql.conf
        -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      start_period: 30s
    networks:
      - wacams-backend
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    labels:
      com.wacams.service: "postgres"
      com.wacams.environment: "production"

  # ===========================================================================
  # PROMETHEUS - Metrics Collection
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: wacams-prometheus
    <<: *default-restart
    expose:
      - "9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alert-rules.yml:/etc/prometheus/alert-rules.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
    networks:
      - wacams-monitoring
      - wacams-backend
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      com.wacams.service: "prometheus"
      com.wacams.environment: "production"

  # ===========================================================================
  # GRAFANA - Visualization & Dashboards
  # ===========================================================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: wacams-grafana
    <<: *default-restart
    expose:
      - "3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-clock-panel
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      - wacams-monitoring
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    labels:
      com.wacams.service: "grafana"
      com.wacams.environment: "production"

  # ===========================================================================
  # ALERTMANAGER - Alert Routing
  # ===========================================================================
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: wacams-alertmanager
    <<: *default-restart
    expose:
      - "9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    healthcheck:
      <<: *default-healthcheck
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
    networks:
      - wacams-monitoring
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M
    labels:
      com.wacams.service: "alertmanager"
      com.wacams.environment: "production"

  # ===========================================================================
  # NODE-EXPORTER - Host Metrics
  # ===========================================================================
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: wacams-node-exporter
    <<: *default-restart
    expose:
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.rootfs=/rootfs'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|container)($$|/)'
    networks:
      - wacams-monitoring
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    labels:
      com.wacams.service: "node-exporter"
      com.wacams.environment: "production"

  # ===========================================================================
  # PG-EXPORTER - PostgreSQL Metrics
  # ===========================================================================
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.15.0
    container_name: wacams-postgres-exporter
    <<: *default-restart
    expose:
      - "9187"
    environment:
      DATA_SOURCE_NAME: "postgresql://${DB_USER}:${DB_PASSWORD}@postgres:5432/${DB_NAME}?sslmode=disable"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wacams-monitoring
      - wacams-backend
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
    labels:
      com.wacams.service: "postgres-exporter"
      com.wacams.environment: "production"

  # ===========================================================================
  # BACKUP - Automated Database Backup Service
  # ===========================================================================
  backup:
    image: prodrigestivill/postgres-backup-local:16
    container_name: wacams-backup
    <<: *default-restart
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      SCHEDULE: ${BACKUP_SCHEDULE:-@daily}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
      BACKUP_KEEP_WEEKS: ${BACKUP_KEEP_WEEKS:-4}
      BACKUP_KEEP_MONTHS: ${BACKUP_KEEP_MONTHS:-6}
      POSTGRES_EXTRA_OPTS: "--clean --if-exists --schema=public --blobs"
      BACKUP_DIR: /backups
    volumes:
      - postgres_backup:/backups
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wacams-backend
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    labels:
      com.wacams.service: "backup"
      com.wacams.environment: "production"

# =============================================================================
# NETWORKS
# =============================================================================
networks:
  wacams-frontend:
    driver: bridge
    labels:
      com.wacams.network: "frontend"
  wacams-backend:
    driver: bridge
    internal: true
    labels:
      com.wacams.network: "backend"
  wacams-monitoring:
    driver: bridge
    labels:
      com.wacams.network: "monitoring"

# =============================================================================
# VOLUMES
# =============================================================================
volumes:
  postgres_data:
    driver: local
    driver_opts:
      type: none
      device: /data/wacams/postgres
      o: bind
  postgres_logs:
    driver: local
  postgres_backup:
    driver: local
    driver_opts:
      type: none
      device: /data/wacams/backup
      o: bind
  signatures_data:
    driver: local
  backend_logs:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
    driver_opts:
      type: none
      device: /data/wacams/prometheus
      o: bind
  grafana_data:
    driver: local
  alertmanager_data:
    driver: local
